name: CI

on:
  push:
    branches: [main, impl, feat/**]
  pull_request:

env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: --deny warnings

jobs:
  test-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: [cargo, clippy, rustfmt]
      - run: cargo test --lib --no-fail-fast
      - run: cargo clippy --lib --no-deps -- -D warnings

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: [rust-src, clippy, rustfmt]
          targets: wasm32-unknown-unknown
      - run: rustup component add rust-src 2>/dev/null || true
      - run: cargo build --release --target wasm32-unknown-unknown
      - name: Prove zero external crates (offline)
        run: |
          grep -q '^# intentionally empty' Cargo.toml
          rm -rf target
          CARGO_NET_OFFLINE=true cargo build --release --target wasm32-unknown-unknown
      - run: test -f target/wasm32-unknown-unknown/release/exotic_orbits_sim.wasm
